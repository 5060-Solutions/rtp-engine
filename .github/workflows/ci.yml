name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # audiopus_sys vendors an Opus tree whose cmake_minimum_required predates what
  # CMake 4 will accept. Nothing to do with this crate; it just surfaced when
  # Windows joined the matrix, since the other runners resolve Opus through a
  # system package instead of building it.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # meson and ninja build the bundled WebRTC audio processing C++ sources
      # that the `audio-proc` feature needs. --all-features turns it on.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libopus-dev meson ninja-build
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opus meson ninja
      - name: Install Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install meson ninja
      # Without this meson finds mingw's g++ first, and abseil-cpp does not
      # compile against mingw's windows.foundation.h.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      # --all-features turns on audio-proc, so this actually runs the echo
      # canceller on every platform rather than only proving it links.
      #
      # Windows runs serially. Native code that faults takes the whole harness
      # process with it, and under the parallel runner the output just stops
      # with no indication of which test was to blame -- which cost several
      # rounds when the WASAPI fault first appeared.
      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test --all-features
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --all-features -- --test-threads=1

      # A native fault gives an exit code and nothing else, which is close to
      # useless. cdb ships with the Windows SDK already on these runners, so on
      # failure re-run under it and print the faulting stack.
      - name: Faulting stack (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cdb) { Write-Host "cdb.exe not found"; exit 0 }
          $exe = (cargo test --all-features --lib --no-run --message-format=json 2>$null |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch {} } |
            Where-Object { $_.executable } |
            Select-Object -Last 1).executable
          Write-Host "test binary: $exe"
          & $cdb.FullName -c "g; !analyze -v; q" $exe --test-threads=1 2>&1 |
            Select-String -Pattern "FAULTING_SOURCE|SYMBOL_NAME|FAILURE_BUCKET_ID|EXCEPTION_CODE|rtp_engine.*!|cpal::|windows::" |
            Select-Object -First 40
          exit 0

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev and the audio-proc toolchain
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev meson ninja-build
      - name: Clippy
        run: cargo clippy --all-features --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev and the audio-proc toolchain
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev meson ninja-build
      - name: Build docs
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

