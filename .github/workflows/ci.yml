name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # audiopus_sys vendors an Opus tree whose cmake_minimum_required predates what
  # CMake 4 will accept. Nothing to do with this crate; it just surfaced when
  # Windows joined the matrix, since the other runners resolve Opus through a
  # system package instead of building it.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # meson and ninja build the bundled WebRTC audio processing C++ sources
      # that the `audio-proc` feature needs. --all-features turns it on.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libopus-dev meson ninja-build
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opus meson ninja
      - name: Install Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install meson ninja
      # Without this meson finds mingw's g++ first, and abseil-cpp does not
      # compile against mingw's windows.foundation.h.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      # --all-features turns on audio-proc, so this actually runs the echo
      # canceller on every platform rather than only proving it links.
      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test --all-features
      # Windows runs one test at a time and unbuffered. Native code that faults
      # takes the whole harness process with it, and under the default parallel
      # runner the output stops with no indication of which test was to blame.
      # TEMPORARY. Diagnosing a STATUS_ACCESS_VIOLATION that only appears on
      # Windows, in the SRTP tests, with or without the C++ audio dependency.
      # rtp-engine denies unsafe_code and the SRTP module holds no unbounded
      # state, so the fault has to come from a dependency's unsafe code. This
      # answers three things at once: whether it is deterministic, whether it
      # survives optimisation, and whether it needs anything beyond the crypto
      # crates. Remove once the cause is known.
      # pwsh, not bash: under bash, Git's /usr/bin precedes the MSVC toolchain
      # on PATH and rustc invokes coreutils `link` instead of link.exe, which
      # fails every build with "extra operand".
      - name: Diagnose the Windows SRTP fault
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($i in 1..3) {
            Write-Host "===== debug run $i ====="
            cargo test --lib srtp -- --test-threads=1 --nocapture 2>&1 | Select-Object -Last 5
          }
          Write-Host "===== release ====="
          cargo test --release --lib srtp -- --test-threads=1 --nocapture 2>&1 | Select-Object -Last 5
          Write-Host "===== srtp feature only, no opus/cpal ====="
          cargo test --no-default-features --features srtp --lib srtp -- --test-threads=1 --nocapture 2>&1 | Select-Object -Last 5
          exit 0

      # Default features first, so a Windows failure can be attributed. The
      # SRTP rollover test faults here with STATUS_ACCESS_VIOLATION; running it
      # without audio-proc establishes whether the C++ dependency is involved
      # at all, rather than assuming it is because it is the newest thing.
      - name: Run tests, default features (Windows)
        if: runner.os == 'Windows'
        run: cargo test -- --test-threads=1
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --all-features -- --test-threads=1 --nocapture

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev and the audio-proc toolchain
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev meson ninja-build
      - name: Clippy
        run: cargo clippy --all-features --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev and the audio-proc toolchain
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev meson ninja-build
      - name: Build docs
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

